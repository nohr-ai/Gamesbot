[tool.poetry]
name = "gamesbot"
version = "0.1.0"
description = "Discord bot for minigames"
authors = ["KjetilAI"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
discord-py = "^2.5.2"
odfpy = "^1.4.1"
python-dotenv = "^1.1.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
